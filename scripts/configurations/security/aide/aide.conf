# AIDE configuration file
# Basic integrity monitoring for critical system files

database=file:/var/lib/aide/aide.db.gz
database_out=file:/var/lib/aide/aide.db.new.gz
gzip_dbout=yes
verbose=5

# Define file group types
p = p+i+n+u+g+s+m+c+acl+selinux+xattrs

# Monitor critical system directories with exclusions
/
    /etc p+i+n+u+g+s+m+c+acl+selinux+xattrs
    /usr/bin p+i+n+u+g+s+m+c+acl+selinux+xattrs
    /usr/sbin p+i+n+u+g+s+m+c+acl+selinux+xattrs
    /bin p+i+n+u+g+s+m+c+acl+selinux+xattrs
    /sbin p+i+n+u+g+s+m+c+acl+selinux+xattrs
    /root p+i+n+u+g+s+m+c+acl+selinux+xattrs
    /home p+i+n+u+g+s+m+c+acl+selinux+xattrs
    /var/www p+i+n+u+g+s+m+c+acl+selinux+xattrs
    /var/log p+i+n+u+g+s+m+c+acl+selinux+xattrs
    /var/cache p+i+n+u+g+s+m+c+acl+selinux+xattrs
    /var/tmp p+i+n+u+g+s+m+c+acl+selinux+xattrs

# Explicit exclusions
/etc/passwd = -
/etc/shadow = -
/etc/group = -
/etc/gshadow = -
/etc/sudoers = -
/etc/sudoers.d/ = -
/proc = -
/sys = -
/dev = -
/run = -
/tmp = -
/var/log = -
/var/cache = -
/var/tmp = -