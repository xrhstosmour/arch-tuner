- repo: https://github.com/koalaman/shellcheck-precommit
  rev: v0.11.0
  hooks:
    - id: shellcheck
      args: [-x, -S, warning]

- repo: https://github.com/gitleaks/gitleaks
  rev: v8.30.1
  hooks:
    - id: gitleaks

- repo: https://github.com/igorshubovych/markdownlint-cli
  rev: v0.49.1
  hooks:
    - id: markdownlint
